<header class="masthead">
  <div class="masthead-inner">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
    <nav class="site-nav" aria-label="Site">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' or page.layout == 'project' %} aria-current="page"{% endif %}>Projects</a>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
      <span class="icon-moon">{% include icon.html name="moon" %}</span>
      <span class="icon-sun">{% include icon.html name="sun" %}</span>
    </button>
  </div>
</header>
